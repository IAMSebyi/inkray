name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Build production bundle (Vite)
        run: npm run build

      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Run inference workflows in Chromium
        if: runner.os == 'Linux'
        run: npm run test:e2e

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch (Linux / Windows)
        if: runner.os != 'macOS'
        run: pip install "torch>=2.4" "torchvision>=0.19" --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyTorch (macOS)
        if: runner.os == 'macOS'
        run: pip install "torch>=2.4" "torchvision>=0.19"

      - name: Install core backend and test dependencies
        run: pip install -e ".[dev]"

      - name: Verify Python bytecode compilation
        run: python -m compileall -q app tests scripts

      - name: Run backend test suite (pytest)
        run: pytest -v

  docs:
    name: Docs Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ASCII-only documentation
        run: |
          python3 -c '
          import pathlib, sys
          failures = []
          for name in ("README.md", "CONTRIBUTING.md", "LICENSE"):
              text = pathlib.Path(name).read_text(encoding="utf-8")
              bad = [(idx + 1, ch, hex(ord(ch))) for idx, ch in enumerate(text) if ord(ch) not in range(0x20, 0x7f) and ch != "\n"]
              if bad:
                  failures.append((name, bad[:10]))
          if failures:
              print("Non-ASCII characters found:", failures)
              sys.exit(1)
          print("All root docs contain only printable ASCII characters.")
          '
