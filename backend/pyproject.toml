[project]
name = "inkray-backend"
version = "0.1.0"
description = "Python/FastAPI geometry and intrinsic appearance inference service for Inkray"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0.0",
  "diffusers==0.38.0",
  "fastapi>=0.115.0",
  "huggingface-hub>=1.8.0,<2",
  "numpy>=2.0",
  "pillow>=10.4.0",
  "python-multipart>=0.0.12",
  "safetensors>=0.4.0",
  "scipy>=1.11.0",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.49.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
moge = [
  "moge @ git+https://github.com/microsoft/MoGe.git ; sys_platform == 'linux' or sys_platform == 'win32'",
]
marigold-v2 = [
  "marigold-v2 @ git+https://github.com/huawei-bayerlab/marigold-v2.git@9926d93b0780de5f64bee20895b25a56a98ffbf8 ; sys_platform == 'linux'",
]
iid-in-the-wild = [
  "intrinsic @ git+https://github.com/compphoto/Intrinsic.git",
  "scikit-image>=0.22.0",
]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
