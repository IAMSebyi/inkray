[project]
name = "inkray-backend"
version = "0.1.0"
description = "Python/FastAPI geometry inference service for Inkray"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0.0",
  "diffusers>=0.41.0",
  "fastapi>=0.115.0",
  "numpy>=2.0",
  "pillow>=10.4.0",
  "python-multipart>=0.0.12",
  "safetensors>=0.4.0",
  "scipy>=1.11.0",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.49.0",
  "uvicorn[standard]>=0.32.0",
  "moge @ git+https://github.com/microsoft/MoGe.git",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
