[project]
name = "inkray-backend"
version = "0.1.0"
description = "Future Python/FastAPI inference service for Inkray"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
